name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    # Hooks must behave the same on every OS Claude Code runs on — that is why they are Node.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/unit/*.test.mjs"
